name: dotori-dev

services:
  db:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "compute_query_id=on"]
    container_name: db-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6378:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./app
      args:
        INSTALL_AI_DEPS: "0"
        INSTALL_DEV_DEPS: "1"
    container_name: app-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - ./app:/app
      - ./data/uploads:/data/uploads
      - ./data/logs:/data/logs
      - ./data/config:/data/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    command: [ "bash", "-lc", "python manage.py runserver 0.0.0.0:8000" ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/files/healthcheck/')" ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 60s

  embedding-worker:
    build:
      context: ./app
      args:
        INSTALL_AI_DEPS: "1"
        INSTALL_DEV_DEPS: "1"
    container_name: embedding-worker-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - ./app:/app
      - ./data/uploads:/data/uploads
      - ./data/logs:/data/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "bash", "-lc", "celery -A config worker -l info -B -Q parse,embed --concurrency=$${DOCUMENT_AI_WORKER_CONCURRENCY:-1} --prefetch-multiplier=1" ]

  search-worker:
    build:
      context: ./app
      args:
        INSTALL_AI_DEPS: "1"
        INSTALL_DEV_DEPS: "1"
    container_name: search-worker-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - ./app:/app
      - ./data/uploads:/data/uploads
      - ./data/logs:/data/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "bash", "-lc", "celery -A config worker -l info -Q search --concurrency=$${SEARCH_WORKER_CONCURRENCY:-1} --prefetch-multiplier=1" ]

  query-worker:
    build:
      context: ./app
      args:
        INSTALL_AI_DEPS: "0"
        INSTALL_DEV_DEPS: "1"
    container_name: query-worker-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - ./app:/app
      - ./data/uploads:/data/uploads
      - ./data/logs:/data/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "bash", "-lc", "celery -A config worker -l info -Q query --concurrency=$${QUERY_WORKER_CONCURRENCY:-1} --prefetch-multiplier=1" ]

  rag-worker:
    build:
      context: ./app
      args:
        INSTALL_AI_DEPS: "0"
        INSTALL_DEV_DEPS: "1"
    container_name: rag-worker-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - ./app:/app
      - ./data/uploads:/data/uploads
      - ./data/logs:/data/logs
      - ./data/config:/data/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "bash", "-lc", "celery -A config worker -l info -Q rag --concurrency=$${RAG_WORKER_CONCURRENCY:-1} --prefetch-multiplier=1" ]

  nginx:
    image: nginx:stable
    container_name: nginx-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      NGINX_ENVSUBST_FILTER: "^NGINX_SERVER_NAME$"
    ports:
      - "8888:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/templates/default.conf.template:ro
      - ./data/uploads:/var/www/uploads:ro
    depends_on:
      app:
        condition: service_started

  llama-rag:
    build:
      context: ./llama-rag
      dockerfile: Dockerfile
    container_name: llama-rag-dev
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - .env.dev
    volumes:
      - ./llama-rag/data/cache:/root/.cache
      - ./data/config:/config:ro
    command: >
      --hf-repo ggml-org/gemma-4-E4B-it-GGUF:Q4_K_M --host 0.0.0.0 --port 8080 --threads 8 --ctx-size 4096 --parallel 2 --metrics --reasoning auto --reasoning-budget 64
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  vllm-rag:
    build:
      context: ./vllm-rag
      dockerfile: Dockerfile
    container_name: vllm-rag-dev
    restart: unless-stopped
    ports:
      - "8083:8080"
    env_file:
      - .env.dev
    volumes:
      - ./vllm-rag/data/cache:/root/.cache/huggingface
      - ./data/config:/config:ro
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  vllm-query-parser:
    build:
      context: ./vllm-query
      dockerfile: Dockerfile
    container_name: vllm-query-parser-dev
    restart: unless-stopped
    ports:
      - "8082:8080"
    env_file:
      - .env.dev
    environment:
      HF_HOME: /root/.cache/huggingface

      # CPU용 KV Cache (GiB). RAM OOM 주의
      VLLM_CPU_KVCACHE_SPACE: "${QUERY_PARSER_CPU_KVCACHE_SPACE:-1}"

      # 추론에 사용할 cpu core: {0-7, 0-15, auto, nobind}
      VLLM_CPU_OMP_THREADS_BIND: "${QUERY_PARSER_CPU_OMP_THREADS_BIND:-auto}"

      # auto binding시 vllm frontend용으로 남길 cpu 수
      VLLM_CPU_NUM_OF_RESERVED_CPU: "${QUERY_PARSER_CPU_NUM_OF_RESERVED_CPU:-1}"

    volumes:
      - ./vllm-query/data/cache:/root/.cache
    shm_size: "4g"
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp=unconfined
    entrypoint: [ "bash", "-lc" ]
    command:
      - >
        python3 -m vllm.entrypoints.openai.api_server --host 0.0.0.0 --port 8080 --model "$${QUERY_PARSER_MODEL:-meta-llama/Llama-3.2-3B-Instruct}" --served-model-name "$${QUERY_PARSER_SERVED_MODEL_NAME:-meta-llama/Llama-3.2-3B-Instruct}" --max-model-len "$${QUERY_PARSER_MAX_MODEL_LEN:-4096}" --dtype "$${QUERY_PARSER_DTYPE:-bfloat16}"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  llama-query-parser:
    build:
      context: ./llama-query
      dockerfile: Dockerfile
    container_name: llama-query-parser-dev
    restart: unless-stopped
    ports:
      - "8083:8080"
    env_file:
      - .env.dev
    volumes:
      - ./llama-query/data/cache:/root/.cache
    entrypoint:
      - sh
      - -lc
    command:
      - >
        exec /app/llama-server
        --hf-repo "$${QUERY_PARSER_LLAMA_HF_REPO:-bartowski/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M}"
        --alias "$${QUERY_PARSER_LLAMA_ALIAS:-query-parser}"
        --host 0.0.0.0
        --port 8080
        --threads "$${QUERY_PARSER_LLAMA_THREADS:-8}"
        --ctx-size "$${QUERY_PARSER_LLAMA_CTX_SIZE:-2048}"
        --parallel "$${QUERY_PARSER_LLAMA_PARALLEL:-1}"
        --metrics
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 180s
