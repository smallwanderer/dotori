server {
    listen 80;
    server_name sangque.ddns.net;

    server_tokens off;
    client_max_body_size 200m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name sangque.ddns.net;

    server_tokens off;
    client_max_body_size 200m;

    ssl_certificate /etc/letsencrypt/live/sangque.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sangque.ddns.net/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:OpenShelfTLS:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 정적 파일 제공 (Django collectstatic 결과물)
    location /static/ {
        alias /var/www/staticfiles/;
        access_log off;
        expires 30d;
    }

    # 내부 테스트용 미디어 파일 (필요시 사용, 또는 권한 검사 등)
    location /internal-test/ {
        internal;
        alias /var/www/uploads/;
    }

    # 백엔드 프록시
    location / {
        proxy_pass http://app:8000;

        # Request CORS Header
        proxy_set_header Host $http_host;

        # Response CORS Header
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
