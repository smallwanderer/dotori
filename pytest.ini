[pytest]
DJANGO_SETTINGS_MODULE = config.settings
testpaths = app/tests app/files app/accounts
pythonpath = app
python_files = tests.py test_*.py *_test.py
addopts = -p no:cacheprovider
markers =
    unit: fast tests using local fakes or the isolated test database, without real parser/model/runtime services
    integration: tests covering cross-component behavior or real parser/model/runtime boundaries
    manual: scripts intended for manual execution only
