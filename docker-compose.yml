name: dotori

services:
  db:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "compute_query_id=on"]
    container_name: db
    restart: always
    env_file:
      - .env
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./app
      args:
        INSTALL_AI_DEPS: "0"
    container_name: app
    restart: always
    env_file:
      - .env
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/staticfiles:/app/staticfiles
      - ./data/logs:/data/logs
      - ./data/config:/data/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    command: >
      bash -lc "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/files/healthcheck/')" ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 60s

  test:
    profiles: ["test"]
    build:
      context: ./app
      args:
        INSTALL_AI_DEPS: "1"
        INSTALL_DEV_DEPS: "1"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "pytest"]

  embedding-worker:
    build:
      context: ./app
      args:
        INSTALL_AI_DEPS: "1"
    container_name: embedding-worker
    restart: always
    env_file:
      - .env
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/logs:/data/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "bash", "-lc", "celery -A config worker -l info -Q parse,embed --concurrency=$${DOCUMENT_AI_WORKER_CONCURRENCY:-1} --prefetch-multiplier=1" ]

  search-worker:
    build:
      context: ./app
      args:
        INSTALL_AI_DEPS: "1"
    container_name: search-worker
    restart: always
    env_file:
      - .env
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/logs:/data/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "bash", "-lc", "celery -A config worker -l info -Q search --concurrency=$${SEARCH_WORKER_CONCURRENCY:-1} --prefetch-multiplier=1" ]

  rag-worker:
    build:
      context: ./app
      args:
        INSTALL_AI_DEPS: "0"
    container_name: rag-worker
    restart: always
    env_file:
      - .env
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/logs:/data/logs
      - ./data/config:/data/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "bash", "-lc", "celery -A config worker -l info -Q rag --concurrency=$${RAG_WORKER_CONCURRENCY:-1} --prefetch-multiplier=1" ]

  recovery-worker:
    build:
      context: ./app
      args:
        INSTALL_AI_DEPS: "0"
    container_name: recovery-worker
    restart: always
    env_file:
      - .env
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/logs:/data/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "bash", "-lc", "celery -A config beat -l info" ]

  nginx:
    image: nginx:stable
    container_name: nginx
    restart: always
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?Set NGINX_SERVER_NAME in .env}
      LETSENCRYPT_DOMAIN: ${LETSENCRYPT_DOMAIN:?Set LETSENCRYPT_DOMAIN in .env}
      NGINX_ENVSUBST_FILTER: "^(NGINX_SERVER_NAME|LETSENCRYPT_DOMAIN)$"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/uploads:/var/www/uploads:ro
      - ./data/staticfiles:/var/www/staticfiles:ro
    depends_on:
      app:
        condition: service_started

  llama-rag:
    build:
      context: ./llama-rag
      dockerfile: Dockerfile
    container_name: llama-rag
    restart: always
    expose:
      - "8080"
    env_file:
      - .env
    volumes:
      - ./llama-rag/data/cache:/root/.cache
      - ./data/config:/config:ro
    command: >
      --hf-repo ggml-org/gemma-4-E4B-it-GGUF:Q4_K_M --host 0.0.0.0 --port 8080 --threads 8 --ctx-size 4096 --parallel 1 --metrics
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  vllm-rag:
    build:
      context: ./vllm-rag
      dockerfile: Dockerfile
    container_name: vllm-rag
    restart: always
    expose:
      - "8080"
    env_file:
      - .env
    volumes:
      - ./vllm-rag/data/cache:/root/.cache/huggingface
      - ./data/config:/config:ro
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
