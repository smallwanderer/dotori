name: dotori

x-dotori-app: &dotori-app
  image: dotori-app:local
  build:
    context: ./app
    args:
      INSTALL_AI_DEPS: "1"
      INSTALL_DEV_DEPS: "0"

services:
  db:
    image: pgvector/pgvector:pg16
    command: [ "postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "compute_query_id=on" ]
    container_name: db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    <<: *dotori-app
    container_name: app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOTORI_DJANGO_ALLOWED_HOSTS: ${DOTORI_DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DOTORI_DJANGO_CSRF_TRUSTED_ORIGINS: ${DOTORI_DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      DOTORI_DJANGO_SECURE_PROXY_SSL_HEADER: ${DOTORI_DJANGO_SECURE_PROXY_SSL_HEADER:-0}
      DOTORI_DJANGO_SECURE_SSL_REDIRECT: ${DOTORI_DJANGO_SECURE_SSL_REDIRECT:-0}
      DOTORI_DJANGO_SESSION_COOKIE_SECURE: ${DOTORI_DJANGO_SESSION_COOKIE_SECURE:-0}
      DOTORI_DJANGO_CSRF_COOKIE_SECURE: ${DOTORI_DJANGO_CSRF_COOKIE_SECURE:-0}
      RUNTIME_SCOPE: production
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/staticfiles:/app/staticfiles
      - ./data/logs:/data/logs
      - ./data/config:/data/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - rag-runtime
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      bash -lc "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/files/healthcheck/')" ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 60s

  test:
    profiles: [ "test" ]
    image: dotori-app-test:local
    build:
      context: ./app
      args:
        INSTALL_AI_DEPS: "1"
        INSTALL_DEV_DEPS: "1"
    env_file:
      - .env
    volumes:
      - ./installation:/app/installation:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "python", "-m", "pytest" ]

  embedding-worker:
    <<: *dotori-app
    container_name: embedding-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/logs:/data/logs
      - ./data/config:/data/config:ro
      - huggingface-cache:/app/.cache/huggingface
    environment:
      RUNTIME_SCOPE: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "bash", "-lc", "celery -A config worker -l info -Q parse,embed --concurrency=$${DOCUMENT_AI_WORKER_CONCURRENCY:-1} --prefetch-multiplier=1" ]

  search-worker:
    <<: *dotori-app
    container_name: search-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/logs:/data/logs
      - ./data/config:/data/config:ro
      - huggingface-cache:/app/.cache/huggingface
    environment:
      RUNTIME_SCOPE: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "bash", "-lc", "celery -A config worker -l info -Q search --concurrency=$${SEARCH_WORKER_CONCURRENCY:-1} --prefetch-multiplier=1" ]

  rag-worker:
    <<: *dotori-app
    profiles: [ "managed-rag" ]
    container_name: rag-worker
    # The external runtime lifecycle starts this worker only after the
    # selected runtime validates. Do not auto-start it on Docker daemon boot.
    restart: on-failure:5
    env_file:
      - .env
    environment:
      RUNTIME_SCOPE: production
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/logs:/data/logs
      - ./data/config:/data/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - rag-runtime
    command: [ "bash", "-lc", "celery -A config worker -l info -Q rag --concurrency=$${RAG_WORKER_CONCURRENCY:-1} --prefetch-multiplier=1" ]

  recovery-worker:
    <<: *dotori-app
    container_name: recovery-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/logs:/data/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "bash", "-lc", "celery -A config beat -l info" ]

  nginx:
    image: nginx:stable
    container_name: nginx
    restart: unless-stopped
    profiles: [ "direct-https" ]
    environment:
      DOTORI_EXTERNAL_DOMAIN: ${DOTORI_EXTERNAL_DOMAIN:-}
      NGINX_ENVSUBST_FILTER: "^DOTORI_EXTERNAL_DOMAIN$"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/config/network_access/nginx:/etc/nginx/templates:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 10s
      timeout: 5s
      retries: 3
  # The RAG runtime container (llama.cpp or vLLM, whichever is selected) is
  # intentionally NOT defined here. It's a single, scope-scoped container
  # ("dotori-llm") managed directly by
  # app/llm_installation/runtime_lifecycle.py (plain docker build/run/stop/rm),
  # reachable from app/rag-worker at http://rag-runtime:8080 over the
  # named "rag-runtime" network below. See
  # dev-docs/agent/rag_runtime_container_lifecycle.md.

networks:
  rag-runtime:
    name: dotori-runtime
    driver: bridge

volumes:
  postgres-data:
    name: dotori-postgres-data
  huggingface-cache:
    name: dotori-huggingface-cache
