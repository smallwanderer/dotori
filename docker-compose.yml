name: dotori

services:
  db:
    image: pgvector/pgvector:pg16
    command: [ "postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "compute_query_id=on" ]
    container_name: db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    # app never loads BGE-M3/docling (dotori-document's model process does,
    # exclusively — see RemoteBGEM3Provider). Its own image skips
    # requirements.ai.txt (torch, FlagEmbedding, sentence-transformers) and
    # requirements.parser-docling.txt (docling, torchvision, tesseract-ocr),
    # so rebuilds are fast and don't pull multi-GB AI wheels.
    image: dotori-app-web:local
    build:
      context: .
      dockerfile: app/Dockerfile
      target: web
      args:
        INSTALL_AI_DEPS: "0"
        INSTALL_PARSER_DOCLING: "0"
        INSTALL_TEST_DEPS: "0"
    container_name: app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOTORI_DJANGO_ALLOWED_HOSTS: ${DOTORI_DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # 4173 is the local Vite dev server. Production serves the SPA from the
      # same origin and should override this list with its HTTPS origin.
      DOTORI_DJANGO_CSRF_TRUSTED_ORIGINS: ${DOTORI_DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:4173,http://127.0.0.1:4173}
      DOTORI_DJANGO_SECURE_PROXY_SSL_HEADER: ${DOTORI_DJANGO_SECURE_PROXY_SSL_HEADER:-0}
      DOTORI_DJANGO_SECURE_SSL_REDIRECT: ${DOTORI_DJANGO_SECURE_SSL_REDIRECT:-0}
      DOTORI_DJANGO_SESSION_COOKIE_SECURE: ${DOTORI_DJANGO_SESSION_COOKIE_SECURE:-0}
      DOTORI_DJANGO_CSRF_COOKIE_SECURE: ${DOTORI_DJANGO_CSRF_COOKIE_SECURE:-0}
      DOTORI_SPA_ENABLED: ${DOTORI_SPA_ENABLED:-1}
      RUNTIME_SCOPE: production
      SERVICE_NAME: app
      EMBEDDING_SERVICE_URL: http://dotori-document:${EMBEDDING_SERVICE_PORT:-8001}
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/staticfiles:/app/staticfiles
      - ./data/logs:/data/logs
      - ./data/evaluation:/data/evaluation
      - ./data/config:/data/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      dotori-document:
        condition: service_healthy
    networks:
      - default
      - rag-runtime
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      bash -lc "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn config.asgi:application --worker-class uvicorn_worker.UvicornWorker --bind 0.0.0.0:8000 --workers $${WEB_CONCURRENCY:-2} --timeout $${GUNICORN_TIMEOUT:-360}"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/files/healthcheck/')" ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 60s

  test:
    profiles: [ "test" ]
    image: dotori-app-test:local
    build:
      context: .
      dockerfile: app/Dockerfile
      target: backend
      args:
        INSTALL_AI_DEPS: "1"
        INSTALL_PARSER_DOCLING: "1"
        INSTALL_TEST_DEPS: "1"
    env_file:
      - .env
    volumes:
      - ./installation:/app/installation:ro
    # Resource-snapshot tests need the production config mount point to exist,
    # but must never inspect or mutate the host's real runtime configuration.
    tmpfs:
      - /data/config
      - /data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "python", "-m", "pytest" ]

  dotori-document:
    # The only process that loads BGE-M3. Parsing and document-embedding Celery
    # work run in independent services below, but both proxy model calls to
    # this internal HTTP endpoint so the model remains loaded exactly once.
    image: dotori-app:local
    build:
      context: .
      dockerfile: app/Dockerfile
      target: backend
      args:
        INSTALL_AI_DEPS: "1"
        INSTALL_PARSER_DOCLING: "1"
        INSTALL_TEST_DEPS: "0"
    container_name: dotori-document
    restart: unless-stopped
    # Relative CPU priority, not a hard cap: app and dotori-llm are left at
    # Docker's default (1024), so under real contention (embedding running
    # while the LLM is generating) the scheduler favors them over
    # dotori-document. When the host is idle, dotori-document can still use
    # every core it wants -- this only bites when cores are actually contested.
    cpu_shares: ${EMBEDDING_MODEL_CPU_SHARES:-256}
    env_file:
      - .env
    volumes:
      - ./data/logs:/data/logs
      - ./data/config:/data/config:ro
      - huggingface-cache:/app/.cache/huggingface
    environment:
      RUNTIME_SCOPE: production
      SERVICE_NAME: dotori-document
      # dotori-document is the only process allowed to load BGE-M3. app calls
      # /embed/ over the compose network instead of loading the model itself;
      # this Host header must be accepted.
      DOTORI_DJANGO_ALLOWED_HOSTS: dotori-document,localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "${EMBEDDING_SERVICE_PORT:-8001}"
    # One model-owning process. Increasing --workers would duplicate BGE-M3.
    command: [ "bash", "-lc", "DOTORI_EMBEDDING_MODEL_PROCESS=1 exec gunicorn config.wsgi:application --bind 0.0.0.0:$${EMBEDDING_SERVICE_PORT:-8001} --workers 1 --threads $${EMBEDDING_HTTP_THREADS:-8} --timeout 60" ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${EMBEDDING_SERVICE_PORT:-8001}/readyz')" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s

  parse-worker:
    image: dotori-app:local
    build:
      context: .
      dockerfile: app/Dockerfile
      target: backend
      args:
        INSTALL_AI_DEPS: "1"
        INSTALL_PARSER_DOCLING: "1"
        INSTALL_TEST_DEPS: "0"
    container_name: parse-worker
    restart: unless-stopped
    cpu_shares: ${PARSE_WORKER_CPU_SHARES:-256}
    env_file:
      - .env
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/logs:/data/logs
      - ./data/config:/data/config:ro
      - huggingface-cache:/app/.cache/huggingface
    environment:
      RUNTIME_SCOPE: production
      SERVICE_NAME: parse-worker
      EMBEDDING_SERVICE_URL: http://dotori-document:${EMBEDDING_SERVICE_PORT:-8001}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      dotori-document:
        condition: service_healthy
    command: [ "celery", "-A", "config", "worker", "-l", "info", "-Q", "parse", "--concurrency=${PARSE_WORKER_CONCURRENCY:-1}", "--prefetch-multiplier=1", "--hostname=parse@%h" ]

  embedding-worker:
    image: dotori-app:local
    build:
      context: .
      dockerfile: app/Dockerfile
      target: backend
      args:
        INSTALL_AI_DEPS: "1"
        INSTALL_PARSER_DOCLING: "1"
        INSTALL_TEST_DEPS: "0"
    container_name: embedding-worker
    restart: unless-stopped
    cpu_shares: ${EMBEDDING_WORKER_CPU_SHARES:-256}
    env_file:
      - .env
    volumes:
      - ./data/logs:/data/logs
      - ./data/config:/data/config:ro
      - huggingface-cache:/app/.cache/huggingface
    environment:
      RUNTIME_SCOPE: production
      SERVICE_NAME: embedding-worker
      EMBEDDING_SERVICE_URL: http://dotori-document:${EMBEDDING_SERVICE_PORT:-8001}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      dotori-document:
        condition: service_healthy
    command: [ "celery", "-A", "config", "worker", "-l", "info", "-Q", "embed", "--concurrency=${EMBEDDING_WORKER_CONCURRENCY:-1}", "--prefetch-multiplier=1", "--hostname=embed@%h" ]

  nginx:
    image: nginx:stable
    container_name: nginx
    restart: unless-stopped
    profiles: [ "direct-https" ]
    environment:
      DOTORI_EXTERNAL_DOMAIN: ${DOTORI_EXTERNAL_DOMAIN:-}
      NGINX_ENVSUBST_FILTER: "^DOTORI_EXTERNAL_DOMAIN$"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/config/network_access/nginx:/etc/nginx/templates:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 10s
      timeout: 5s
      retries: 3
  # The RAG runtime container (llama.cpp or vLLM, whichever is selected) is
  # intentionally NOT defined here. It's a single, scope-scoped container
  # ("dotori-llm") managed directly by
  # app/llm_installation/runtime_lifecycle.py (plain docker build/run/stop/rm),
  # reachable from app at http://rag-runtime:8080 over the
  # named "rag-runtime" network below. See
  # dev-docs/agent/rag-runtime-container-lifecycle.md.

networks:
  rag-runtime:
    name: dotori-runtime
    driver: bridge

volumes:
  postgres-data:
    name: dotori-postgres-data
  huggingface-cache:
    name: dotori-huggingface-cache
