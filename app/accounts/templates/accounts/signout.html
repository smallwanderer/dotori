{% extends "accounts/base.html" %}

{% block title %}Signed Out | 도토리 문서{% endblock %}

{% block auth_header %}
<h1 data-i18n="signOutTitle">로그아웃 완료</h1>
<p data-i18n="signOutSubtitle">성공적으로 로그아웃되었습니다.</p>
{% endblock %}

{% block auth_body %}
<a href="{% url 'accounts:login' %}" class="btn btn-primary auth-submit" data-i18n="signOutAgain">다시 로그인</a>
{% endblock %}

{% block auth_footer %}
<a href="{% url 'accounts:signup' %}" data-i18n="signOutCreateAccount">새 계정 만들기</a>
{% endblock %}
