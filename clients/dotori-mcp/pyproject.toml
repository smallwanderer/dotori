[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dotori-mcp"
version = "0.1.0"
description = "Read-only MCP adapter for a self-hosted Dotori server"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2,<3",
]

[project.scripts]
dotori-mcp = "dotori_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
